name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q MacroBot.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-disabled: true
      - run: gradle assembleDebug --no-daemon
        working-directory: MacroBot
      - uses: actions/upload-artifact@v4
        with:
          name: MacroBot-apk
          path: MacroBot/app/build/outputs/apk/debug/app-debug.apk
